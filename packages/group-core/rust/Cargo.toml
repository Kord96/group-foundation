[package]
name = "group-foundation-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Portable MLS group custody and staged mechanics"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }
openmls = { version = "=0.8.1", features = ["extensions-draft-08", "js"] }
openmls_basic_credential = "=0.5.0"
openmls_memory_storage = { version = "=0.5.0", features = ["extensions-draft-08"] }
openmls_rust_crypto = "=0.5.1"
openmls_traits = { version = "=0.5.0", features = ["extensions-draft-08"] }
sha2 = "0.10"
serde_json = "1"
thiserror = "2"
wasm-bindgen = { version = "=0.2.127", optional = true }
js-sys = { version = "=0.3.104", optional = true }

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
